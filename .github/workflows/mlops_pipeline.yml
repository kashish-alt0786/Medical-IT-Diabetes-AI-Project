name: MLOps Retraining and Quality Control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "train.py"
      - "train_model.py"
      - "model_training.py"
      - "predictor.py"
      - "preprocessing.py"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/mlops_pipeline.yml"

permissions:
  contents: write

jobs:
  validate-and-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Format check
        run: python -m black --check src tests

      - name: Unit tests
        run: python -m pytest -q

      - name: Retrain and evaluate models
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python train_model.py

      - name: Generate evaluation artifacts and dataset snapshot
        run: python scripts/generate_evaluation_artifacts.py

      - name: Commit refreshed model, metrics and artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.pkl model_metrics.json model_selection.json model_meta.json history.csv data/pima_indians_diabetes.csv assets/confusion_matrix.png assets/roc_auc_curve.png assets/shap_importance.png
          git diff --cached --quiet || git commit -m "chore: refresh diabetes model and MLOps artifacts"
          git push
