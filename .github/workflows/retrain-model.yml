name: Retrain Diabetes Risk Model

on:
  workflow_dispatch:
  push:
    paths:
      - "model_training.py"
      - "train_model.py"
      - "requirements.txt"
      - ".github/workflows/retrain-model.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.6.1 imbalanced-learn==0.13.0 xgboost==2.1.1 joblib==1.5.3

      - name: Train and evaluate models
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python train_model.py

      - name: Commit refreshed model and monitoring artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.pkl model_metrics.json model_selection.json model_meta.json history.csv
          git diff --cached --quiet || git commit -m "chore: refresh diabetes model and MLOps metrics"
          git push
