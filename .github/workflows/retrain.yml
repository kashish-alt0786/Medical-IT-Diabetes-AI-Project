name: Retrain Diabetes Risk Model

on:
  push:
    branches: [main]
    paths:
      - 'train.py'
      - 'requirements.txt'
      - '.github/workflows/retrain.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain and evaluate
        run: python train.py

      - name: Commit model artifacts and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model.pkl model_metrics.json model_meta.json history.csv
          git diff --cached --quiet || git commit -m "chore: update diabetes model artifacts"
          git push
